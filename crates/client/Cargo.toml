[package]
name = "wareboxes-client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Wareboxes WMS transitional desktop client (eframe + egui)"

[[bin]]
name = "wareboxes-client"
path = "src/main.rs"

[dependencies]
wareboxes-domain = { workspace = true }
wareboxes-core = { workspace = true }
wareboxes-barcodes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
egui = "0.35"
egui_extras = "0.35"
ehttp = "0.5"
lucide-icons = "1.25"
uuid = { version = "1.11", features = ["v4"] }
env_logger = "0.11"

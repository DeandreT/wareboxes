[package]
name = "wareboxes-web-ops"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Wareboxes server-rendered operations web application"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wareboxes-api-contract = { workspace = true }
wareboxes-barcodes = { workspace = true }
wareboxes-core = { workspace = true }
leptos = { workspace = true }
leptos_router = { workspace = true }
lucide-leptos = { version = "3.26.0", default-features = false, features = [
    "arrows",
    "buildings",
    "devices",
    "files",
    "layout",
    "notifications",
    "security",
    "shapes",
    "text",
    "transportation",
] }
serde = { workspace = true }
serde_json = { workspace = true }
urlencoding = "2"

console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2.106", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = { version = "0.6", features = ["http"] }
uuid = { version = "1", features = ["js", "v4"] }
web-sys = { version = "0.3", features = [
    "Blob",
    "Document",
    "Element",
    "File",
    "FileList",
    "FormData",
    "HtmlInputElement",
    "Node",
    "PointerEvent",
    "Window",
] }

[features]
default = []
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
]
ssr = [
    "leptos/ssr",
    "leptos_router/ssr",
]

[package]
name = "wareboxes-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Wareboxes API and SSR process composition root"

[features]
default = []
ssr = ["wareboxes-api/ssr", "dep:leptos"]

[[bin]]
name = "wareboxes-server"
path = "src/main.rs"

[dependencies]
wareboxes-api = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
axum = { version = "0.8", features = ["macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
leptos = { workspace = true, features = ["ssr"], optional = true }

[dev-dependencies]
wareboxes-api-contract = { workspace = true }
wareboxes-core = { workspace = true }
wareboxes-domain = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
sqlx = { version = "0.7", default-features = false, features = [
    "runtime-tokio",
    "postgres",
] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
hex = "0.4"
url = "2"

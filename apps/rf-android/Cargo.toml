[package]
name = "wareboxes-rf-android"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[lib]
name = "wareboxes_rf_android"
crate-type = ["cdylib", "lib"]

[dependencies]
ehttp = "=0.5.0"
egui = { version = "0.35.0", default-features = false }
lucide-icons = "1.27.0"
rusqlite = { version = "=0.30.0", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10.9"
thiserror = { workspace = true }
url = "2.5.4"
uuid = { version = "=1.8.0", features = ["v4"] }
wareboxes-api-contract = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
eframe = { version = "0.35.0", default-features = false, features = [
    "android-native-activity",
    "default_fonts",
    "glow",
] }
log = "0.4"
winit = { version = "0.30.13", default-features = false }

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.35.0", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }

[package.metadata.android]
package = "com.wareboxes.rf"
apk_name = "wareboxes-rf"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 36

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application]
label = "Wareboxes RF"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"
uses_cleartext_traffic = false

[package.metadata.android.application.activity]
orientation = "portrait"
exported = true

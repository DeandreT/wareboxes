name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Match the repository build-memory envelope even if a runner overrides Cargo
  # configuration defaults.
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wareboxes_admin
          POSTGRES_PASSWORD: wareboxes_admin
          POSTGRES_DB: wareboxes
        ports:
          - 5432:5432
        options: >-
          --shm-size=256m
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Architecture boundaries
        run: scripts/check-boundaries.sh

      - name: Public API contract drift
        run: >-
          cargo run --locked -p wareboxes-api
          --example export_integration_openapi --
          --check developer-docs/api-reference/integrations-v1.openapi.json

      - name: Developer documentation JSON
        run: >-
          jq empty
          developer-docs/scalar.config.json
          developer-docs/api-reference/integrations-v1.openapi.json
          developer-docs/examples/v1/submit-order.json
          developer-docs/examples/v1/processed-order-response.json

      - name: Production operations configuration
        run: |
          bash -n \
            deploy/provision.sh \
            deploy/wareboxes-deploy \
            deploy/wareboxes-backup \
            deploy/wareboxes-archive-commands \
            deploy/wareboxes-restore-drill \
            deploy/wareboxes-restore-postgres \
            scripts/build-images.sh \
            scripts/seed-inventory.sh \
            scripts/test-backup-restore.sh \
            scripts/test-command-archive.sh \
            scripts/test-automation-envelope.sh \
            scripts/test-load-envelope.sh \
            scripts/verify-systemd-units.sh \
            scripts/test-support/restic
          scripts/verify-systemd-units.sh
          docker run --rm --volume "$PWD:/mnt:ro" \
            koalaman/shellcheck-alpine@sha256:5921d946dac740cbeec2fb1c898747b6105e585130cc7f0602eec9a10f7ddb63 \
            shellcheck \
              /mnt/deploy/provision.sh \
              /mnt/deploy/wareboxes-deploy \
              /mnt/deploy/wareboxes-backup \
              /mnt/deploy/wareboxes-archive-commands \
              /mnt/deploy/wareboxes-restore-drill \
              /mnt/deploy/wareboxes-restore-postgres \
              /mnt/scripts/build-images.sh \
              /mnt/scripts/seed-inventory.sh \
              /mnt/scripts/test-backup-restore.sh \
              /mnt/scripts/test-command-archive.sh \
              /mnt/scripts/test-automation-envelope.sh \
              /mnt/scripts/test-load-envelope.sh \
              /mnt/scripts/verify-systemd-units.sh \
              /mnt/scripts/test-support/restic
          docker run --rm --entrypoint /bin/promtool --volume "$PWD:/mnt:ro" \
            prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 \
            check rules /mnt/deploy/monitoring/wareboxes-alerts.yml
          docker run --rm --entrypoint /bin/promtool --volume "$PWD:/mnt:ro" \
            --workdir /mnt/deploy/monitoring \
            prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 \
            test rules wareboxes-alerts.test.yml

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (SSR)
        run: cargo clippy -p wareboxes-server --all-targets --features ssr -- -D warnings

      - name: Clippy (hydration)
        run: >-
          cargo clippy
          -p wareboxes-web-ops
          --target wasm32-unknown-unknown
          --no-default-features
          --features hydrate
          -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Install cargo-leptos
        run: >-
          curl --proto '=https' --tlsv1.2 -LsSf
          https://github.com/leptos-rs/cargo-leptos/releases/download/v0.3.6/cargo-leptos-installer.sh
          | sh

      - name: Build SSR web application
        run: scripts/build-web.sh

      - name: Build production container images
        env:
          WAREBOXES_IMAGE_TAG: ci
          WAREBOXES_IMAGE_REVISION: ${{ github.sha }}
          WAREBOXES_IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: scripts/build-images.sh

      - name: Test (Postgres)
        env:
          TEST_DATABASE_URL: postgres://wareboxes_admin:wareboxes_admin@localhost:5432/wareboxes
        run: |
          cargo test --workspace --exclude wareboxes-web-ops --locked
          scripts/test-web.sh

      - name: Backup and restore acceptance
        run: scripts/test-backup-restore.sh

      - name: Durable command archive acceptance
        run: scripts/test-command-archive.sh

      - name: Baseline operational load envelope
        run: scripts/test-load-envelope.sh

      - name: Automation throughput and recovery envelope
        run: scripts/test-automation-envelope.sh

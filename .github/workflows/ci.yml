name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wareboxes_admin
          POSTGRES_PASSWORD: wareboxes_admin
          POSTGRES_DB: wareboxes
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (SSR)
        run: cargo clippy -p wareboxes-server --all-targets --features ssr -- -D warnings

      - name: Clippy (hydration)
        run: >-
          cargo clippy
          -p wareboxes-web-ops
          --target wasm32-unknown-unknown
          --no-default-features
          --features hydrate
          -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Install cargo-leptos
        run: >-
          curl --proto '=https' --tlsv1.2 -LsSf
          https://github.com/leptos-rs/cargo-leptos/releases/download/v0.3.6/cargo-leptos-installer.sh
          | sh

      - name: Build SSR web application
        run: scripts/build-web.sh

      - name: Test (Postgres)
        env:
          TEST_DATABASE_URL: postgres://wareboxes_admin:wareboxes_admin@localhost:5432/wareboxes
        run: cargo test --workspace --locked
